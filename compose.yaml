services:
  db:
    image: postgres:16-alpine
    container_name: daylist-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: daylist
      POSTGRES_USER: daylist
      POSTGRES_PASSWORD: daylist_local_dev_only
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - daylist_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U daylist -d daylist"]
      interval: 3s
      timeout: 3s
      retries: 30

volumes:
  daylist_postgres_data:
